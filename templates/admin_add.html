<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin - Add Order</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
  .admin-wrap { max-width: 480px; margin: 40px auto; padding: 0 15px; }
  .admin-wrap h1 { color: #c0392b; margin-bottom: 20px; }
  .admin-form label { display: block; margin-top: 14px; font-size: 14px; color: #4e3e38; }
  .admin-form input, .admin-form select {
    width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #d8c3a5; border-radius: 5px;
  }
  .admin-form button {
    margin-top: 20px; background: #27ae60; color: white; border: none;
    padding: 10px 20px; border-radius: 5px; cursor: pointer;
  }
  .back-link { display: inline-block; margin-bottom: 15px; color: #4e3e38; }
</style>
</head>
<body>

  <div class="admin-wrap">
    <a class="back-link" href="{{ url_for('admin_orders') }}">&larr; Back to Orders</a>
    <h1>Add Order</h1>

    <form class="admin-form" method="POST" action="{{ url_for('admin_add') }}">
      <label for="customer">Customer</label>
      <input type="text" id="customer" name="customer" placeholder="Guest">

      <label for="food_name">Food Item</label>
      <select id="food_name" name="food_name" required>
        {% for name, item in menu.items() %}
        <option value="{{ name }}">{{ name }} - {{ item.price }} birr</option>
        {% endfor %}
      </select>

      <label for="quantity">Quantity</label>
      <input type="number" id="quantity" name="quantity" min="1" value="1" required>

      <label for="total_price">Total Price (birr)</label>
      <input type="number" id="total_price" name="total_price" min="0" step="0.01" required>

      <button type="submit">Save Order</button>
    </form>
  </div>

</body>
</html>
